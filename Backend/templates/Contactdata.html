<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-lg-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Contact Details</h4>
                  <p class="card-description">
                     <code></code>
                  </p>
                  <div class="table-responsive">
                    <table class="table table-hover">
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Email</th>
                          <th>Subject</th>
                          <th>Message</th>

                        </tr>
                      </thead>
                        {% for i in data %}
                      <tbody>
                        <tr>
                          <td>{{i.YourName}}</td>
                          <td>{{i.Email}}</td>
                          <td>{{i.Subject}}</td>
                          <td>{{i.Message}}</td>



                          </td>
                          <td>
                              <a href="{% url 'delete_contact' Contactid=i.id %}">
                                 <button class="badge badge-danger">Delete</button>
                              </a>

                          </td>
                        </tr>
                        {% empty end categ %}

                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
</html>
{% endblock %}
