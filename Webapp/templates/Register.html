<body class="form-v6">
<div class="page-content">
<div class="form-v6-content">
<div class="form-left">
<img src="{% static 'Register/images/form-v6.jpg' %}" alt="form">
</div>
<form class="form-detail" action="{% url 'save_Register' %}" method="post">
  {% csrf_token %}

<div class="form-row">
<input type="text" name="name"  class="input-text" placeholder="Your Name" required>

<input type="password" name="pass"  class="input-text" placeholder="Password" required>

<input type="password" name="comfirm-password"  class="input-text" placeholder="Comfirm Password" required>
</div>

<input type="submit" name="register" class="register" value="Register">
</div>
<div class="form-row-last">
  <p style="color: blue; font-weight: bold; font-size: 16px;">Already a Member?</p>
</div>
<div class="form-row-last">
<a href="{% url 'Loginpg' %}" class="txt1">

</form>
</div>
</div>
